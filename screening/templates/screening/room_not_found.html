{% extends 'base.html' %}
{% block content %}
<div class="container-fluid min-vh-100 d-flex flex-column align-items-center justify-content-center py-5 px-4" 
     style="background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);">
    
    <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4 animate__animated animate__fadeInUp">
        <div class="card border-0 shadow-2xl p-4 p-md-5 text-center overflow-hidden position-relative" 
             style="border-radius: 32px; background: rgba(255, 255, 255, 1);">
            
            <div class="position-absolute top-0 start-0 w-100" style="height: 4px; background: linear-gradient(90deg, #1E3A8A, #4F46E5);"></div>

            <div class="mb-4 mt-2">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle shadow-sm" 
                     style="width: 80px; height: 80px; background: #FFF1F2; border: 6px solid #FFF;">
                    <i class="bi bi-exclamation-circle text-danger fs-1"></i>
                </div>
            </div>

            <h2 class="fw-bold text-slate-900 mb-2" style="letter-spacing: -1px; font-size: 1.75rem;">Room Not Found</h2>
            <p class="text-muted mb-4 px-lg-3 small">
                The access code <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-2 py-1 fw-bold">{{ attempted_code }}</span> 
                is invalid or the hiring room has been closed.
            </p>

            <div class="d-grid gap-3">
                <a href="{% url 'home_ats_checker' %}" 
                   class="btn btn-primary btn-lg rounded-4 fw-bold py-3 shadow-sm border-0 transition-hover" 
                   style="background: linear-gradient(135deg, #1E3A8A, #4F46E5); font-size: 1rem;">
                    <i class="bi bi-arrow-repeat me-2"></i>Try Another Code
                </a>
                
                <a href="{% url 'home_ats_checker' %}" 
                   class="btn btn-link text-decoration-none text-muted fw-bold x-small opacity-75 hover-opacity-100">
                    Return to Candidate Home
                </a>
            </div>
        </div>

        <div class="text-center mt-4">
            <div class="d-inline-flex align-items-center bg-white bg-opacity-10 rounded-pill px-3 py-2">
                <p class="text-white-50 x-small ls-1 fw-medium mb-0 text-uppercase">
                    <i class="bi bi-info-circle me-1"></i> Codes are case-sensitive
                </p>
            </div>
        </div>
    </div>
</div>

<style>
    /* Prevent vertical scroll issues during animation */
    html, body { 
        height: 100%; 
        background: #0F172A; 
        overflow-x: hidden;
    }

    .text-slate-900 { color: #0F172A; }
    .x-small { font-size: 0.75rem; }
    .ls-1 { letter-spacing: 0.05em; }
    
    /* Premium Shadow Depth */
    .shadow-2xl { 
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
    }

    /* Primary Button Hover */
    .transition-hover { 
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
    }
    .transition-hover:hover { 
        transform: translateY(-2px); 
        box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4) !important;
        filter: brightness(1.1);
    }

    /* Sub-badge colors used in Recruiter Dashboard */
    .bg-primary-subtle { background-color: #E0EAFF !important; }

    /* Animation Tweaks */
    .animate__fadeInUp {
        --animate-duration: 0.6s;
    }
</style>
{% endblock %}
